[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser is flagged unmaintained (via egui's font stack). It only parses
  # the fonts bundled in the binary, never a file from the network or the user.
  { id = "RUSTSEC-2026-0192", reason = "parses only embedded fonts; no untrusted input" },
]

[licenses]
version = 2
# Permissive licenses only (MPL-2.0 is file-scoped and does not reach our code).
# Strong copyleft (GPL, LGPL, AGPL) is refused,
# which mechanically enforces the "no code from Gale (GPL-3.0)" rule.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "OFL-1.1",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # Font licenses: egui embeds Ubuntu and Emoji fonts. Embedding is permitted.
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
