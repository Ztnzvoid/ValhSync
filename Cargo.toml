[workspace]
resolver = "3"
members = [
  "crates/valhsync-core",
  "crates/valhsync-ui",
  "crates/valhsync-server",
  "crates/valhsync",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ztnzvoid/ValhSync"
authors = ["Ztnzvoid"]
publish = false

[workspace.dependencies]
valhsync-core = { path = "crates/valhsync-core" }
valhsync-ui = { path = "crates/valhsync-ui" }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# hashing & signatures
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

# filesystem
# Pure-Rust decoders only: `bzip2` would pull a C library in, and the crate's
# `lzma` decoder mis-reads spec-conformant ZIP LZMA entries (it looks for an
# unpacked-size header the ZIP variant does not carry). An archive using either
# is refused by name in `install.rs` rather than half-read.
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
walkdir = "2"
globset = "0.4"
notify = "8"
directories = "6"
tempfile = "3"

# network
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"

# system
sysinfo = { version = "0.35", default-features = false, features = ["system"] }
winreg = "0.55"

# gui
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

# misc
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
winresource = "0.1"
anyhow = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[workspace.lints.rust]
# `deny`, not `forbid`: the publisher has to reach the dedicated server's own
# console -- to send it Ctrl+C, and to type a command into it -- which is FFI
# no safe wrapper covers. Two functions in `valhsync-server::gameserver` carry
# an `#[allow]` and a SAFETY note; nothing else in the workspace may.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic lints that fight the codebase more than they help
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Not "abort": a background job that fails must show the person what happened,
# not make the window disappear. See `gui::worker` and `crash::install_hook`.
