name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      # Rust bakes each source file's path into its panic messages, which for
      # dependencies means the runner's Cargo home. Remap both roots so the
      # binaries name no machine and two builds agree.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$PWD=/valhsync"
          cargo build --workspace --release --locked --target ${{ matrix.target }}
      # Authenticode signing, on Windows, when this repository has been given a
      # SignPath project to sign with. The two executables go up on their own,
      # come back signed, and are put back where the packaging step looks for
      # them. Everything is gated on the variable being set, so a fork -- or
      # this repository before the certificate exists -- still produces a
      # release, unsigned, rather than a failed workflow.
      - name: Stage the binaries for signing
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing/unsigned
          cp "target/${{ matrix.target }}/release/valhsync.exe" signing/unsigned/
          cp "target/${{ matrix.target }}/release/valhsync-server.exe" signing/unsigned/
      - uses: actions/upload-artifact@v4
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        with:
          name: unsigned-${{ matrix.target }}
          path: signing/unsigned/*
          if-no-files-found: error
      - name: Sign with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signing/signed
      - name: Put the signed binaries back
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        shell: bash
        run: |
          set -euo pipefail
          for exe in valhsync.exe valhsync-server.exe; do
            test -f "signing/signed/$exe"
            cp "signing/signed/$exe" "target/${{ matrix.target }}/release/$exe"
          done
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bin="target/${{ matrix.target }}/release"
          ext="${{ matrix.ext }}"

          # Two archives, because two different people receive them: the admin
          # needs both programs and every guide, the player needs the launcher
          # and nothing else. An admin forwards one file, not the publisher and
          # the deployment notes with it.
          licences() {
            cp README.md LICENSE-MIT LICENSE-APACHE "$1/"
            cp crates/valhsync-ui/assets/OFL-Cinzel.txt "$1/LICENSE-Cinzel.txt"
            cp crates/valhsync-ui/assets/OFL-SourceSerif.txt "$1/LICENSE-SourceSerif.txt"
          }

          full="valhsync-${version}-${{ matrix.target }}"
          mkdir -p "dist/$full/docs"
          cp "$bin/valhsync$ext" "$bin/valhsync-server$ext" "dist/$full/"
          licences "dist/$full"
          cp README.md SECURITY.md "dist/$full/"
          cp -r docs/admin-guide.md docs/player-guide.md docs/deploy "dist/$full/docs/"
          cp docs/code-signing-policy.md "dist/$full/docs/"
          cp docs/index.html docs/server-guide.html docs/player-guide.html "dist/$full/docs/"
          cp docs/*.png "dist/$full/docs/"

          player="valhsync-launcher-${version}-${{ matrix.target }}"
          mkdir -p "dist/$player"
          cp "$bin/valhsync$ext" "dist/$player/"
          licences "dist/$player"
          cp docs/player-guide.html docs/launcher.png "dist/$player/"
          cp docs/player-guide.md "dist/$player/README.md"

          cd dist
          for name in "$full" "$player"; do
            if [ "${{ matrix.archive }}" = "zip" ]; then
              7z a -tzip "$name.zip" "$name" > /dev/null
              sha256sum "$name.zip" > "$name.zip.sha256"
            else
              tar czf "$name.tar.gz" "$name"
              sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
            fi
            rm -rf "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
